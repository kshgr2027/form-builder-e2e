name: E2E (Playwright)

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      BASE_URL: http://127.0.0.1:8000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: demo
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4

      # The Laravel app under test lives at ./app in this repo (source only).
      # Alternatively set repo variable APP_REPO (+ APP_REF, secret APP_REPO_TOKEN).
      - name: Checkout app under test (external repo)
        if: ${{ vars.APP_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPO }}
          ref: ${{ vars.APP_REF || '' }}
          path: app
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Prepare app (assert source + runtime dirs + drop uninstalled Telescope config)
        run: |
          set -euxo pipefail
          test -f app/artisan || { echo "::error::Laravel app not found at ./app."; exit 1; }
          mkdir -p app/storage/framework/cache/data \
                   app/storage/framework/sessions \
                   app/storage/framework/views \
                   app/storage/logs \
                   app/storage/app/public \
                   app/bootstrap/cache
          # laravel/telescope is not a dependency of this cut-down app; its config + migration must go.
          rm -f app/config/telescope.php
          rm -f app/database/migrations/*telescope*.php
          ls -la app

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: >-
            bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json,
            mbstring, openssl, pcre, pdo, pdo_mysql, phar, session, simplexml,
            sockets, tokenizer, xml, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Show PHP + extensions
        run: |
          php -v
          php -m

      - name: Composer install (no scripts)
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-reqs

      - name: Dump autoloader + discover packages
        working-directory: app
        run: |
          set -euxo pipefail
          composer dump-autoload --no-interaction --optimize
          php artisan package:discover --ansi

      - name: Configure .env
        working-directory: app
        run: |
          set -euxo pipefail
          cp -f .env.example .env
          php artisan key:generate --force
          php -r '
            $f=".env"; $s=file_get_contents($f);
            $set=function($k,$v)use(&$s){
              $s = preg_match("/^$k=.*$/m",$s) ? preg_replace("/^$k=.*$/m","$k=$v",$s) : $s."\n$k=$v";
            };
            $set("APP_URL","http://127.0.0.1:8000");
            $set("APP_DEBUG","true");
            $set("DB_CONNECTION","mysql");
            $set("DB_HOST","127.0.0.1");
            $set("DB_PORT","3306");
            $set("DB_DATABASE","demo");
            $set("DB_USERNAME","root");
            $set("DB_PASSWORD","root");
            $set("CACHE_DRIVER","file");
            $set("SESSION_DRIVER","file");
            $set("QUEUE_CONNECTION","sync");
            $set("BROADCAST_DRIVER","log");
            $set("MAIL_MAILER","array");
            file_put_contents($f,$s);
          '
          grep -E "^(APP_URL|APP_DEBUG|DB_|CACHE_DRIVER|SESSION_DRIVER|BROADCAST_DRIVER)=" .env

      - name: Boot check
        working-directory: app
        run: |
          set -euxo pipefail
          php artisan --version
          php artisan route:list --json | head -c 400 || true
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            echo "waiting for mysql ($i)"; sleep 2
          done
          mysqladmin ping -h 127.0.0.1 -uroot -proot

      - name: Migrate
        working-directory: app
        run: php artisan migrate --force -vvv

      - name: Import demo.sql
        working-directory: app
        run: |
          set -euxo pipefail
          mysql -h 127.0.0.1 -uroot -proot demo < demo.sql
          mysql -h 127.0.0.1 -uroot -proot demo -e "SHOW TABLES;"

      - name: Start the app
        working-directory: app
        run: |
          set -euxo pipefail
          nohup php artisan serve --host=127.0.0.1 --port=8000 > "$GITHUB_WORKSPACE/artisan-serve.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000 > /dev/null && { echo "app up after ${i}s"; break; }
            sleep 1
          done
          curl -sf http://127.0.0.1:8000 > /dev/null || { echo "::error::app did not start"; cat "$GITHUB_WORKSPACE/artisan-serve.log"; exit 1; }
          curl -s -o /dev/null -w "GET /forms -> %{http_code}\n" http://127.0.0.1:8000/forms

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install suite dependencies
        run: npm ci

      - name: Type-check the suite
        run: npx tsc --noEmit

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report + JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            results/junit.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces / screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload artisan log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artisan-serve-log
          path: artisan-serve.log
          retention-days: 7
          if-no-files-found: ignore
